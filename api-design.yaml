        Replaces the entire workflow definition. Tasks use a client-provided `key`
        so that `dependsOn` references can be expressed before server IDs are assigned.
        Requires portal.workflows.manage permission.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowInput'
      responses:
        '200':
          description: Saved workflow
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workflow'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  # ── Notification Settings ─────────────────
  /portals/{portalId}/request-types/{requestTypeId}/notification-settings:
    parameters:
      - $ref: '#/components/parameters/portalId'
      - $ref: '#/components/parameters/requestTypeId'
    get:
      tags: [Notification Settings]
      operationId: getNotificationSettings
      x-required-permissions: [portal.settings.manage]
      summary: Get notification settings for a request type
      description: Requires portal.settings.manage permission.
      responses:
        '200':
          description: Notification settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationSettings'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Notification Settings]
      operationId: upsertNotificationSettings
      x-required-permissions: [portal.settings.manage]
      summary: Create or replace notification settings for a request type
      description: Requires portal.settings.manage permission.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationSettingsInput'
      responses:
        '200':
          description: Saved notification settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationSettings'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  # ── File Staging ──────────────────────────
  /uploads/stage:
    post:
      tags: [File Uploads]
      operationId: stageFile
      summary: Stage a file before request submission
      description: |
        Uploads a file and returns a short-lived stagedFileId (TTL: 1 hour).
        Use when filling out a request form with file_upload fields: upload each
        document here first, then include the returned stagedFileId as the fieldValue
        when submitting the request. The backend materializes staged files as proper
        request attachments at creation time. Unused staged files are garbage-collected
        after TTL expires.
        Accepted types: image/jpeg, image/png, image/webp, application/pdf.
      requestBody:
        $ref: '#/components/requestBodies/FileUploadBody'
      responses:
        '201':
          description: File staged
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StagedFile'
        '415':
          description: Unsupported media type

  # ── Requests (Internal) ───────────────────
  /portals/{portalId}/requests:
    parameters:
      - $ref: '#/components/parameters/portalId'
    get:
      tags: [Requests]
      operationId: listRequests
      x-required-permissions: [portal.requests.view, portal.requests.manage]
      summary: List all requests in a portal
      description: |
        Requires portal.requests.view or portal.requests.manage permission.
        Results are silently filtered by the caller's ABAC scope constraints:
        - `departmentIds` scope: only requests whose request type belongs to those departments
        - `onlyAssignedToSelf` scope: only requests assigned to the caller
      parameters:
        - name: requestTypeId
          in: query
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/RequestStatus'
        - name: departmentId
          in: query
          schema:
            type: string
            format: uuid
        - name: assignedToMe
          in: query
          schema:
            type: boolean
        - name: page
          in: query
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: perPage
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Paginated list of requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestPage'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /portals/{portalId}/requests/{requestId}:
    parameters:
      - $ref: '#/components/parameters/portalId'
      - $ref: '#/components/parameters/requestId'
    get:
      tags: [Requests]
      operationId: getRequest
      x-required-permissions: [portal.requests.view, portal.requests.manage]
      summary: Get a request
      description: Requires portal.requests.view or portal.requests.manage permission.
      responses:
        '200':
          description: Request detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Request'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Requests]
      operationId: updateRequest
      x-required-permissions: [portal.requests.manage]
      summary: Update a request (internal)
      description: Requires portal.requests.manage permission.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestAdminUpdate'
      responses:
        '200':
          description: Updated request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Request'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /portals/{portalId}/requests/{requestId}/cancel:
    parameters:
      - $ref: '#/components/parameters/portalId'
      - $ref: '#/components/parameters/requestId'
    post:
      tags: [Requests]
      operationId: cancelRequest
      x-required-permissions: [portal.requests.manage]
      summary: Cancel a request (internal user)
      description: Requires portal.requests.manage permission.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
      responses:
        '200':
          description: Request cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Request'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /portals/{portalId}/requests/{requestId}/follow-ups:
    parameters:
      - $ref: '#/components/parameters/portalId'
      - $ref: '#/components/parameters/requestId'
    get:
      tags: [Requests]
      operationId: listFollowUps
      x-required-permissions: [portal.requests.view, portal.requests.manage]
      summary: List follow-up messages on a request (internal view)
      description: Requires portal.requests.view or portal.requests.manage permission.
      responses:
        '200':
          description: Full follow-up thread including internal-only messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FollowUp'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Requests]
      operationId: createFollowUp
      x-required-permissions: [portal.requests.manage]
      summary: Add a follow-up message (internal user)
      description: |
        Creates a follow-up message on the request thread.
        If the message includes file attachments, post the follow-up first to obtain
        the followUpId, then upload each file via
        POST /portals/{portalId}/requests/{requestId}/follow-ups/{followUpId}/attachments.
        Requires portal.requests.manage permission.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FollowUpInput'
      responses:
        '201':
          description: Follow-up created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FollowUp'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /portals/{portalId}/requests/{requestId}/follow-ups/{followUpId}/attachments:
    parameters:
      - $ref: '#/components/parameters/portalId'
      - $ref: '#/components/parameters/requestId'
      - $ref: '#/components/parameters/followUpId'
    post:
      tags: [Requests]
      operationId: uploadFollowUpAttachment
      x-required-permissions: [portal.requests.manage]
      summary: Upload an attachment to a follow-up message (internal user)
      description: |
        Attaches a file to an existing follow-up. Follow-up attachments are kept
        separate from request-level attachments and only appear in the thread.
        Client sequencing: create the follow-up first, then upload files.
        Attempting to upload before the follow-up exists will return 404.
      requestBody:
        $ref: '#/components/requestBodies/FileUploadBody'
      responses:
        '201':
          description: Attachment uploaded and linked to the follow-up
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attachment'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          description: Unsupported media type

  /portals/{portalId}/requests/{requestId}/attachments:
    parameters:
      - $ref: '#/components/parameters/portalId'
      - $ref: '#/components/parameters/requestId'
    post:
      tags: [Requests]
      operationId: uploadRequestAttachment
      x-required-permissions: [portal.requests.manage]
      summary: Upload an attachment to a request
      description: Requires portal.requests.manage permission.
      requestBody:
        $ref: '#/components/requestBodies/FileUploadBody'
      responses:
        '201':
          description: Attachment uploaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attachment'
        '403':
          $ref: '#/components/responses/Forbidden'
        '415':
          description: Unsupported media type

  /portals/{portalId}/requests/{requestId}/receipt:
    parameters:
      - $ref: '#/components/parameters/portalId'
      - $ref: '#/components/parameters/requestId'
    get:
      tags: [Requests]
      operationId: downloadReceipt
      x-required-permissions: [portal.requests.view, portal.requests.manage]
      summary: Download the submission receipt (PDF)
      description: Requires portal.requests.view or portal.requests.manage permission.
      responses:
        '200':
          description: PDF receipt
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ── Request Tasks ─────────────────────────
  /portals/{portalId}/requests/{requestId}/tasks:
    parameters:
      - $ref: '#/components/parameters/portalId'
      - $ref: '#/components/parameters/requestId'
    get:
      tags: [Request Tasks]
      operationId: listTasks
      x-required-permissions: [portal.requests.view, portal.requests.manage]
      summary: List task instances for a request
      description: |
        Requires portal.requests.view or portal.requests.manage permission.
        Results are silently filtered by the caller's ABAC scope constraints:
        - `onlyAssignedToSelf` scope: only task instances assigned to the caller
      responses:
        '200':
          description: Task instances
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TaskInstance'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /portals/{portalId}/requests/{requestId}/tasks/{taskInstanceId}:
    parameters:
      - $ref: '#/components/parameters/portalId'
      - $ref: '#/components/parameters/requestId'
      - $ref: '#/components/parameters/taskInstanceId'
    get:
      tags: [Request Tasks]
      operationId: getTask
      x-required-permissions: [portal.requests.view, portal.requests.manage]
      summary: Get a task instance
      description: Requires portal.requests.view or portal.requests.manage permission.
      responses:
        '200':
          description: Task instance detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskInstance'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Request Tasks]
      operationId: updateTask
      x-required-permissions: [portal.requests.manage]
      summary: Update a task instance (e.g. reassign)
      description: Requires portal.requests.manage permission.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskInstanceUpdate'
      responses:
        '200':
          description: Updated task instance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskInstance'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /portals/{portalId}/requests/{requestId}/tasks/{taskInstanceId}/complete:
    parameters:
      - $ref: '#/components/parameters/portalId'
      - $ref: '#/components/parameters/requestId'
      - $ref: '#/components/parameters/taskInstanceId'
    post:
      tags: [Request Tasks]
      operationId: completeTask
      x-required-permissions: [portal.requests.manage]
      summary: Mark a task instance as complete
      description: |
        Completing a task triggers evaluation of the workflow graph: tasks whose
        dependencies are now fully satisfied are activated. If this is the last task,
        the request moves to `completed`.

        When `outcome` is `clarification_requested`, the workflow pauses and the request
        moves to `pending_clarification` until the citizen responds via the client
        follow-up endpoint with type `clarification_response`.

        When `outcome` is `rejected`, the request moves to `rejected` and no further
        tasks are activated. Requires portal.requests.manage permission.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [outcome]
              properties:
                outcome:
                  $ref: '#/components/schemas/TaskOutcome'
                notes:
                  type: string
      responses:
        '200':
          description: Task completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskInstance'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  # ── Client Portal Auth ────────────────────
  /portals/{portalId}/client/auth/sign-up:
    parameters:
      - $ref: '#/components/parameters/portalId'
    post:
      tags: [Client Auth]
      operationId: clientSignUp
      summary: Citizen self-registration on a portal
      description: |
        Behavior depends on the organization's `citizenIdentityScope` setting:
        - **portal** (default): creates a new citizen record scoped to this portal.
          Returns 422 if the email is already registered on this portal.
        - **org**: creates a shared org-level citizen record. If the email is already
          registered on any other portal in the org, returns 409 with
          `code: citizen_exists_in_org` — the client should redirect to sign-in or
          use the token-exchange endpoint instead.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CitizenSignUpInput'
      responses:
        '201':
          description: Account created and authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CitizenAuthResponse'
        '403':
          description: Password registration is disabled for this portal
        '409':
          description: |
            Email already registered in the organization (only when citizenIdentityScope is org).
            Error code will be `citizen_exists_in_org`. Client should redirect to sign-in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /portals/{portalId}/client/auth/sign-in:
    parameters:
      - $ref: '#/components/parameters/portalId'
    post:
      tags: [Client Auth]
      operationId: clientSignIn
      summary: Citizen sign-in on a portal
      description: |
        Password-based sign-in for citizens.
        When `citizenIdentityScope` is `org`, a citizen registered on any portal in
        the organization can sign in here — access to this portal is automatically
        provisioned on first sign-in.
        Returns 423 if the account is locked due to too many failed attempts (only when lockout is enabled in OrgSettings).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CitizenAuthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '423':
          description: Account locked due to too many failed sign-in attempts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /portals/{portalId}/client/auth/magic-link/request:
    parameters:
      - $ref: '#/components/parameters/portalId'
    post:
      tags: [Client Auth]
      operationId: clientRequestMagicLink
      summary: Request a magic link for citizen sign-up or sign-in
      description: Returns 403 if magic link authentication is disabled in portal settings.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, purpose]
              properties:
                email:
                  type: string
                  format: email
                purpose:
                  type: string
                  enum: [sign_up, sign_in]
                name:
                  type: string
                  description: Captured at sign-up; ignored when purpose is sign_in
                phoneNumber:
                  type: string
                country:
                  type: string
                address:
                  $ref: '#/components/schemas/AddressInput'
      responses:
        '204':
          description: Magic link sent
        '403':
          description: Magic link authentication is disabled for this portal
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /portals/{portalId}/client/auth/magic-link/verify:
    parameters:
      - $ref: '#/components/parameters/portalId'
    post:
      tags: [Client Auth]
      operationId: clientVerifyMagicLink
      summary: Verify a magic link token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
      responses:
        '200':
          description: Token valid; session opened
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CitizenAuthResponse'
        '401':
          description: Token invalid or expired

  /portals/{portalId}/client/auth/token-exchange:
    parameters:
      - $ref: '#/components/parameters/portalId'
    post:
      tags: [Client Auth]
      operationId: clientExchangeToken
      summary: Exchange a cross-portal citizen token (SSO)
      description: |
        Only available when `citizenIdentityScope` is `org` in organization settings.

        Accepts a valid citizen JWT issued by **any portal in the same organization**
        and returns a new JWT scoped to the target portal. The citizen does not need
        to sign in again. If the citizen has never accessed this portal before, access
        is automatically provisioned on first exchange.

        Returns 403 if `citizenIdentityScope` is `portal`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
                  description: A valid citizen JWT from any portal in this organization
      responses:
        '200':
          description: New portal-scoped JWT issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CitizenAuthResponse'
        '401':
          description: Token invalid or expired
        '403':
          description: SSO is not enabled for this organization (citizenIdentityScope is portal)

  /portals/{portalId}/client/auth/sign-out:
    parameters:
      - $ref: '#/components/parameters/portalId'
    post:
      tags: [Client Auth]
      operationId: clientSignOut
      summary: Citizen sign-out
      responses:
        '204':
          description: Signed out

  /portals/{portalId}/client/auth/me:
    parameters:
      - $ref: '#/components/parameters/portalId'
    get:
      tags: [Client Auth]
      operationId: clientGetMe
      summary: Get current citizen profile
      responses:
        '200':
          description: Citizen profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Citizen'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      tags: [Client Auth]
      operationId: clientUpdateMe
      summary: Update citizen profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CitizenProfileUpdate'
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Citizen'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /portals/{portalId}/client/auth/forgot-password:
    parameters:
      - $ref: '#/components/parameters/portalId'
    post:
      tags: [Client Auth]
      operationId: clientForgotPassword
      summary: Request a citizen password reset email
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        '204':
          description: Reset email sent (same response whether the email exists or not)

  /portals/{portalId}/client/auth/reset-password:
    parameters:
      - $ref: '#/components/parameters/portalId'
    post:
      tags: [Client Auth]
      operationId: clientResetPassword
      summary: Reset citizen password using email token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, newPassword]
              properties:
                token:
                  type: string
                  description: Token from the password reset email
                newPassword:
                  type: string
                  format: password
                  minLength: 8
      responses:
        '204':
          description: Password updated; all existing sessions invalidated
        '401':
          description: Token invalid or expired
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /portals/{portalId}/client/auth/refresh:
    parameters:
      - $ref: '#/components/parameters/portalId'
    post:
      tags: [Client Auth]
      operationId: clientRefreshToken
      summary: Refresh a citizen access token
      description: |
        Exchanges a valid refresh token for a new access token and a rotated
        refresh token. The old refresh token is immediately invalidated.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
      responses:
        '200':
          description: New token pair issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CitizenAuthResponse'
        '401':
          description: Refresh token invalid or expired

  /portals/{portalId}/client/auth/sessions:
    parameters:
      - $ref: '#/components/parameters/portalId'
    get:
      tags: [Client Sessions]
      operationId: clientListSessions
      summary: List active citizen sessions on this portal
      responses:
        '200':
          description: Active sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags: [Client Sessions]
      operationId: clientRevokeAllSessions
      summary: Sign out of all devices (revoke all citizen sessions)
      description: Invalidates all active sessions except the current one.
      responses:
        '204':
          description: All other sessions revoked

  /portals/{portalId}/client/auth/sessions/{sessionId}:
    parameters:
      - $ref: '#/components/parameters/portalId'
      - $ref: '#/components/parameters/sessionId'
    delete:
      tags: [Client Sessions]
      operationId: clientRevokeSession
      summary: Revoke a specific citizen session
      responses:
        '204':
          description: Session revoked
        '404':
          $ref: '#/components/responses/NotFound'

  /portals/{portalId}/client/auth/me/verify-email-change:
    parameters:
      - $ref: '#/components/parameters/portalId'
    post:
      tags: [Client Auth]
      operationId: clientVerifyEmailChange
      summary: Verify a pending citizen email change
      description: |
        When a citizen changes their email via PATCH /portals/{portalId}/client/auth/me,
        a verification email is sent to the new address. The old email remains active
        until this endpoint is called with the token from that email.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
      responses:
        '204':
          description: Email change confirmed; new email is now active
        '401':
          description: Token invalid or expired

  /portals/{portalId}/client/auth/me/delete:
    parameters:
      - $ref: '#/components/parameters/portalId'
    post:
      tags: [Client Auth]
      operationId: clientRequestAccountDeletion
      summary: Request deletion of citizen account (LGPD)
      description: |
        Initiates a citizen account deletion request in compliance with LGPD.
        The account is scheduled for deletion after a grace period (default 30 days).
        All active sessions on this portal (or all portals if citizenIdentityScope is org)
        are invalidated immediately. Submitted requests are anonymised, not deleted.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
      responses:
        '204':
          description: Deletion request accepted; account scheduled for removal

  # ── Client Requests ───────────────────────
  /portals/{portalId}/client/request-types:
    parameters:
      - $ref: '#/components/parameters/portalId'
    get:
      tags: [Client Requests]
      operationId: clientListRequestTypes
      summary: List active request types available to citizens
      description: Returns only active (published) request types.
      security: []
      responses:
        '200':
          description: List of request types
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RequestTypeSummary'
        '404':
          $ref: '#/components/responses/NotFound'

  /portals/{portalId}/client/request-types/{requestTypeId}:
    parameters:
      - $ref: '#/components/parameters/portalId'
      - $ref: '#/components/parameters/requestTypeId'
    get:
      tags: [Client Requests]
      operationId: clientGetRequestType
      summary: Get a request type (citizen view)
      description: Returns the request type with its fields for form rendering. Only active types accessible.
      security: []
      responses:
        '200':
          description: Request type detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestType'
        '404':
          $ref: '#/components/responses/NotFound'

  /portals/{portalId}/client/requests:
    parameters:
      - $ref: '#/components/parameters/portalId'
    get:
      tags: [Client Requests]
      operationId: clientListRequests
      summary: List the citizen's own requests
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/RequestStatus'
        - name: page
          in: query
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: perPage
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Paginated list of citizen's own requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestPage'
    post:
      tags: [Client Requests]
      operationId: clientSubmitRequest
      summary: Submit a new request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestInput'
      responses:
        '201':
          description: Request submitted with status = open
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Request'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /portals/{portalId}/client/requests/{requestId}:
    parameters:
      - $ref: '#/components/parameters/portalId'
      - $ref: '#/components/parameters/requestId'
    get:
      tags: [Client Requests]
      operationId: clientGetRequest
      summary: Get a citizen's own request
      responses:
        '200':
          description: Request detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Request'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Client Requests]
      operationId: clientUpdateRequest
      summary: Update a request (citizen)
      description: Citizens may update name, notes, and fieldValues while the request is open.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestCitizenUpdate'
      responses:
        '200':
          description: Updated request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Request'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /portals/{portalId}/client/requests/{requestId}/cancel:
    parameters:
      - $ref: '#/components/parameters/portalId'
      - $ref: '#/components/parameters/requestId'
    post:
      tags: [Client Requests]
      operationId: clientCancelRequest
      summary: Cancel a request (citizen)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
      responses:
        '200':
          description: Request cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Request'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /portals/{portalId}/client/requests/{requestId}/follow-ups:
    parameters:
      - $ref: '#/components/parameters/portalId'
      - $ref: '#/components/parameters/requestId'
    get:
      tags: [Client Requests]
      operationId: clientListFollowUps
      summary: List follow-up messages (citizen view)
      description: Returns the shared thread; internal-only messages are excluded.
      responses:
        '200':
          description: Follow-up thread
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FollowUp'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Client Requests]
      operationId: clientCreateFollowUp
      summary: Add a follow-up message (citizen)
      description: |
        Used for general messages and clarification responses (type: clarification_response).
        If the message includes files, post the follow-up first to obtain the followUpId,
        then upload via .../follow-ups/{followUpId}/attachments.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FollowUpInput'
      responses:
        '201':
          description: Follow-up created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FollowUp'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /portals/{portalId}/client/requests/{requestId}/follow-ups/{followUpId}/attachments:
    parameters:
      - $ref: '#/components/parameters/portalId'
      - $ref: '#/components/parameters/requestId'
      - $ref: '#/components/parameters/followUpId'
    post:
      tags: [Client Requests]
      operationId: clientUploadFollowUpAttachment
      summary: Upload an attachment to a citizen follow-up
      description: |
        Client sequencing: create the follow-up first, then upload files.
        Attempting to upload before the follow-up exists will return 404.
      requestBody:
        $ref: '#/components/requestBodies/FileUploadBody'
      responses:
        '201':
          description: Attachment uploaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attachment'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          description: Unsupported media type

  /portals/{portalId}/client/requests/{requestId}/receipt:
    parameters:
      - $ref: '#/components/parameters/portalId'
      - $ref: '#/components/parameters/requestId'
    get:
      tags: [Client Requests]
      operationId: clientDownloadReceipt
      summary: Download submission receipt (PDF)
      responses:
        '200':
          description: PDF receipt
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

# ─────────────────────────────────────────────
# COMPONENTS
# ─────────────────────────────────────────────
components:

  requestBodies:
    FileUploadBody:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            required: [name, file]
            properties:
              name:
                type: string
                maxLength: 255
                description: Consumer-provided label for this file
              file:
                type: string
                format: binary
          encoding:
            file:
              contentType: image/jpeg, image/png, image/webp, application/pdf

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    userId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    portalId:
      name: portalId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    departmentId:
      name: departmentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    requestTypeId:
      name: requestTypeId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    requestId:
      name: requestId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    taskInstanceId:
      name: taskInstanceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    followUpId:
      name: followUpId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    roleId:
      name: roleId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    sessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    invitationId:
      name: invitationId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    Unauthorized:
      description: Missing or invalid authentication token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Caller does not have the required permission
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnprocessableEntity:
      description: Validation errors
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'
    Conflict:
      description: Conflict — the request cannot be completed due to the current state of the resource
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnexpectedError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:

    # ── Organization ───────────────────────
    Organization:
      type: object
      required: [id, name, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        createdAt:
          type: string
          format: date-time

    OrganizationUpdate:
      type: object
      properties:
        name:
          type: string

    OrgSettings:
      type: object
      properties:
        citizenIdentityScope:
          type: string
          enum: [portal, org]
          default: portal
          description: |
            Controls how citizen identities are managed across portals:
            - **portal** (default): each portal has an independent citizen registry.
              Citizens must register separately on each portal.
            - **org**: citizens share a single identity across all portals in the
              organization. Sign-up on any portal creates one account; sign-in on
              any portal works immediately; SSO via token-exchange is enabled.
            Switching from `org` back to `portal` is blocked once citizens have
            accessed more than one portal.
        lockout:
          allOf:
            - $ref: '#/components/schemas/LockoutSettings'
          nullable: true
          description: Account lockout policy. Null means lockout is disabled (platform default).
        mfa:
          allOf:
            - $ref: '#/components/schemas/MfaSettings'
          nullable: true
          description: MFA policy for org members. Null means MFA is disabled (platform default).
        updatedAt:
          type: string
          format: date-time
          nullable: true
        updatedBy:
          allOf:
            - $ref: '#/components/schemas/UserSummary'
          nullable: true

    OrgSettingsUpdate:
      type: object
      properties:
        citizenIdentityScope:
          type: string
          enum: [portal, org]
          description: |
            Changing from `portal` to `org` merges existing citizen records by email.
            Changing from `org` to `portal` is rejected (409) if any citizen has
            accessed more than one portal.
        lockout:
          allOf:
            - $ref: '#/components/schemas/LockoutSettings'
          nullable: true
          description: Pass null to disable lockout and revert to platform default (no lockout).
        mfa:
          allOf:
            - $ref: '#/components/schemas/MfaSettings'
          nullable: true
          description: Pass null to disable MFA. Blocked (409) if any org member currently has MFA enrolled.

    LockoutSettings:
      type: object
      required: [enabled]
      properties:
        enabled:
          type: boolean
          description: When true, accounts are locked after exceeding maxFailedAttempts
          default: false
        maxFailedAttempts:
          type: integer
          minimum: 1
          maximum: 100
          default: 5
          description: Number of consecutive failed sign-in attempts before the account is locked
        lockoutDurationMinutes:
          type: integer
          minimum: 1
          default: 15
          description: |
            How long the account stays locked in minutes. After this period the
            account unlocks automatically. Admins can also unlock manually via
            POST /org/users/{userId}/unlock.

    MfaSettings:
      type: object
      required: [enabled]
      properties:
        enabled:
          type: boolean
          description: When true, org members may enroll in MFA
          default: false
        required:
          type: boolean
          description: |
            When true, all org members must have MFA enrolled. Sign-in returns 202
            and requires a TOTP challenge to complete. Members without MFA enrolled
            are prompted to enroll on their next sign-in.
          default: false

    MfaEnrollment:
      type: object
      properties:
        secret:
          type: string
          description: Base32-encoded TOTP secret to be stored in the authenticator app
        qrCodeUrl:
          type: string
          format: uri
          description: otpauth:// URL that encodes the secret as a QR code for authenticator apps
        expiresAt:
          type: string
          format: date-time
          description: Time by which enrollment must be confirmed via POST /auth/mfa/confirm-enrollment

    MfaChallengeResponse:
      type: object
      properties:
        mfaToken:
          type: string
          description: Short-lived single-use token to be submitted with the TOTP code to POST /auth/mfa/challenge
        expiresAt:
          type: string
          format: date-time

    # ── Portal ─────────────────────────────
    Portal:
      type: object
      required: [id, name, status, clientDomain, adminDomain, createdBy, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        status:
          type: string
          enum: [active, archived]
        clientDomain:
          type: string
          description: Auto-generated domain for the citizen-facing portal
          example: "minha-prefeitura.portalu.io"
        adminDomain:
          type: string
          description: Auto-generated domain for the internal admin portal
          example: "admin.minha-prefeitura.portalu.io"
        createdBy:
          $ref: '#/components/schemas/UserSummary'
        createdAt:
          type: string
          format: date-time

    PortalInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
        description:
          type: string
          nullable: true

    PortalUpdate:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
          nullable: true

    # ── Users ──────────────────────────────
    UserSummary:
      type: object
      description: Lightweight user reference used in nested contexts
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          nullable: true
        email:
          type: string
          format: email

    OrgUser:
      type: object
      required: [id, email, emailVerified, status, orgRoles, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          nullable: true
        email:
          type: string
          format: email
        emailVerified:
          type: boolean
        status:
          type: string
          enum: [active, inactive]
        orgRoles:
          type: array
          items:
            $ref: '#/components/schemas/Role'
        createdAt:
          type: string
          format: date-time

    OrgUserInput:
      type: object
      required: [email, name]
      properties:
        name:
          type: string
        email:
          type: string
          format: email

    OrgUserUpdate:
      type: object
      properties:
        name:
          type: string
        status:
          type: string
          enum: [active, inactive]

    OrgUserPage:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/OrgUser'
        pagination:
          $ref: '#/components/schemas/Pagination'

    PortalUser:
      type: object
      required: [id, email, status, roleAssignments, addedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          nullable: true
        email:
          type: string
          format: email
        status:
          type: string
          enum: [active, inactive]
        roleAssignments:
          type: array
          description: Portal role assignments, each with their ABAC scope constraints
          items:
            $ref: '#/components/schemas/RoleAssignment'
        addedAt:
          type: string
          format: date-time

    PortalUserInput:
      type: object
      required: [userId]
      properties:
        userId:
          type: string
          format: uuid
          description: Must be an existing org user
        roleIds:
          type: array
          description: Portal roles to assign immediately (optional)
          items:
            type: string
            format: uuid

    PortalUserPage:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/PortalUser'
        pagination:
          $ref: '#/components/schemas/Pagination'

    ProfileUpdate:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        currentPassword:
          type: string
          format: password
          description: Required when changing the password
        newPassword:
          type: string
          format: password
          minLength: 8

    # ── Auth responses ─────────────────────
    SignUpResponse:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/OrgUser'
        message:
          type: string
          example: "Verification email sent. Please check your inbox."

    AuthResponse:
      type: object
      properties:
        token:
          type: string
          description: Short-lived Bearer JWT for subsequent requests
        refreshToken:
          type: string
          description: Long-lived token used to obtain a new access token via POST /auth/refresh
        user:
          $ref: '#/components/schemas/OrgUser'

    Session:
      type: object
      required: [id, createdAt, lastUsedAt, expiresAt, isCurrent]
      properties:
        id:
          type: string
          format: uuid
        userAgent:
          type: string
          nullable: true
          description: Browser or client identifier from the User-Agent header at sign-in
        ipAddress:
          type: string
          nullable: true
          description: IP address at sign-in
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        isCurrent:
          type: boolean
          description: True if this is the session making the request

    Invitation:
      type: object
      required: [id, email, status, createdAt, expiresAt]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
          nullable: true
        status:
          type: string
          enum: [pending, accepted, expired, cancelled]
        invitedBy:
          $ref: '#/components/schemas/UserSummary'
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        acceptedAt:
          type: string
          format: date-time
          nullable: true

    EffectivePermissions:
      type: object
      properties:
        userId:
          type: string
          format: uuid
        permissions:
          type: array
          description: Deduplicated list of permission keys granted by all the user's portal roles
          items:
            type: string
          example: [portal.requests.view, portal.requests.manage]
        scopes:
          type: array
          description: ABAC scope constraints from each role assignment; empty means no restrictions
          items:
            $ref: '#/components/schemas/Scope'

    # ── Citizens ───────────────────────────
    Citizen:
      type: object
      required: [id, email, createdAt]
      description: |
        External user who submits requests through a client portal.
        When `citizenIdentityScope` is `portal` (default), each portal has its own
        independent citizen registry. When `citizenIdentityScope` is `org`, the
        citizen identity is shared across all portals in the organization — one account,
        one profile, access to any portal without re-registering.
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          nullable: true
        email:
          type: string
          format: email
        phoneNumber:
          type: string
          nullable: true
        country:
          type: string
          nullable: true
          description: ISO 3166-1 alpha-2 country code
        address:
          allOf:
            - $ref: '#/components/schemas/Address'
          nullable: true
        portalAccess:
          type: array
          description: |
            Portals this citizen has access to. Only present when
            `citizenIdentityScope` is `org`; omitted in portal-scoped mode.
          items:
            type: object
            properties:
              portalId:
                type: string
                format: uuid
              portalName:
                type: string
              firstAccessAt:
                type: string
                format: date-time
        createdAt:
          type: string
          format: date-time

    CitizenSignUpInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 8
        name:
          type: string
        phoneNumber:
          type: string
        country:
          type: string
        address:
          $ref: '#/components/schemas/AddressInput'

    CitizenProfileUpdate:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        phoneNumber:
          type: string
          nullable: true
        country:
          type: string
          nullable: true
        address:
          $ref: '#/components/schemas/AddressInput'
        currentPassword:
          type: string
          format: password
        newPassword:
          type: string
          format: password
          minLength: 8

    CitizenAuthResponse:
      type: object
      properties:
        token:
          type: string
          description: |
            Short-lived Bearer JWT scoped to this portal's client context.
            When `citizenIdentityScope` is `org`, this token can be passed to
            `POST /portals/{portalId}/client/auth/token-exchange` on any other
            portal in the organization to obtain a portal-scoped token without
            re-authenticating.
        refreshToken:
          type: string
          description: Long-lived token used to obtain a new access token via POST /portals/{portalId}/client/auth/refresh
        citizen:
          $ref: '#/components/schemas/Citizen'

    # ── RBAC ───────────────────────────────
    RoleLevel:
      type: string
      enum: [org, portal]

    Scope:
      type: object
      description: |
        ABAC constraints applied to a portal-level role assignment.
        Constraints are defined by the platform; orgs configure values, not rules.
        All constraints are optional and composable. Omitting a constraint means
        no restriction on that dimension.
      properties:
        departmentIds:
          type: array
          description: |
            Restricts the assignment to resources belonging to these departments.
            Applies to: request types, workflows, departments, requests.
            Omit or set to null for access across all departments.
          items:
            type: string
            format: uuid
          nullable: true
        onlyAssignedToSelf:
          type: boolean
          description: |
            When true, restricts request and task access to records assigned to this user.
            Applies to: requests, task instances.
          default: false

    RoleAssignment:
      type: object
      required: [id, role, assignedAt]
      description: A role granted to a portal user, optionally scoped by ABAC constraints
      properties:
        id:
          type: string
          format: uuid
        role:
          $ref: '#/components/schemas/Role'
        scope:
          allOf:
            - $ref: '#/components/schemas/Scope'
          nullable: true
          description: Null means no scope constraints; the role applies to all resources
        assignedAt:
          type: string
          format: date-time

    RoleAssignmentInput:
      type: object
      required: [roleId]
      properties:
        roleId:
          type: string
          format: uuid
        scope:
          allOf:
            - $ref: '#/components/schemas/Scope'
          nullable: true
          description: Omit or set to null to grant access without scope constraints

    OrgPermission:
      type: string
      enum:
        - org.users.manage
        - org.portals.manage
      description: |
        - org.users.manage: add/update/deactivate org users; assign org roles
        - org.portals.manage: create/update/archive portals

    PortalPermission:
      type: string
      enum:
        - portal.users.manage
        - portal.settings.manage
        - portal.request_types.view
        - portal.request_types.manage
        - portal.workflows.view
        - portal.workflows.manage
        - portal.departments.manage
        - portal.requests.view
        - portal.requests.manage
      description: |
        - portal.users.manage: add/remove portal users; assign portal roles
        - portal.settings.manage: update portal settings and notification rules
        - portal.request_types.view: read-only access to request types and fields
        - portal.request_types.manage: create/update/archive request types
        - portal.workflows.view: read-only access to workflow definitions
        - portal.workflows.manage: create/replace workflow definitions
        - portal.departments.manage: create/update/delete departments
        - portal.requests.view: read-only access to all requests and tasks
        - portal.requests.manage: process requests, complete tasks, add follow-ups

    PermissionDefinition:
      type: object
      description: Metadata for a system permission used to build role configuration UIs
      properties:
        key:
          type: string
          example: "portal.requests.manage"
        label:
          type: string
          example: "Manage Requests"
        description:
          type: string
          example: "Process requests, complete tasks, and add follow-up messages"
        level:
          $ref: '#/components/schemas/RoleLevel'

    Role:
      type: object
      required: [id, name, level, permissions, isDefault, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        level:
          $ref: '#/components/schemas/RoleLevel'
        permissions:
          type: array
          description: Permission keys assigned to this role
          items:
            type: string
          example: ["portal.requests.view", "portal.requests.manage"]
        isDefault:
          type: boolean
          description: True for system-seeded roles; these cannot be deleted
        createdAt:
          type: string
          format: date-time

    RoleInput:
      type: object
      required: [name, permissions]
      properties:
        name:
          type: string
        description:
          type: string
          nullable: true
        permissions:
          type: array
          description: Permission keys to assign; must all match the role's level
          items:
            type: string
          example: ["portal.requests.view", "portal.requests.manage"]

    RoleUpdate:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
          nullable: true
        permissions:
          type: array
          items:
            type: string

    # ── Portal Settings ────────────────────
    PortalBranding:
      type: object
      properties:
        primaryColor:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'
          description: Primary brand color as a 6-digit hex code
          example: "#1A73E8"
          nullable: true

    PortalSettings:
      type: object
      properties:
        magicLinkEnabled:
          type: boolean
          description: When true, citizens may sign up and sign in via magic link
          default: false
        branding:
          allOf:
            - $ref: '#/components/schemas/PortalBranding'
          nullable: true
          description: Visual branding applied to the citizen-facing portal
        updatedAt:
          type: string
          format: date-time
          nullable: true
        updatedBy:
          allOf:
            - $ref: '#/components/schemas/UserSummary'
          nullable: true

    PortalSettingsUpdate:
      type: object
      properties:
        magicLinkEnabled:
          type: boolean
        branding:
          allOf:
            - $ref: '#/components/schemas/PortalBranding'
          nullable: true
          description: Pass null to remove branding and revert to default

    # ── Common ─────────────────────────────
    Pagination:
      type: object
      properties:
        page:
          type: integer
        perPage:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer

    Address:
      type: object
      properties:
        streetNumber:
          type: string
          example: "742"
        additionalInfo:
          type: string
          nullable: true
        city:
          type: string
          example: "São Paulo"
        state:
          type: string
          example: "SP"
        postcode:
          type: string
          example: "01310-100"
        country:
          type: string
          example: "BR"

    AddressInput:
      type: object
      properties:
        streetNumber:
          type: string
        additionalInfo:
          type: string
          nullable: true
        city:
          type: string
        state:
          type: string
        postcode:
          type: string
        country:
          type: string

    ValidationError:
      type: object
      properties:
        message:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string

    ErrorResponse:
      type: object
      required: [message, code]
      properties:
        message:
          type: string
        code:
          type: string
          description: Machine-readable error code
        details:
          type: object
          additionalProperties: true
          description: Optional structured context (field-level info, conflict reason, etc.)
          nullable: true

    FieldOption:
      type: object
      required: [label, value]
      properties:
        label:
          type: string
          maxLength: 255
        value:
          type: string
          maxLength: 100

    # ── Department ─────────────────────────
    Department:
      type: object
      required: [id, name, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        createdAt:
          type: string
          format: date-time

    DepartmentInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 255

    DepartmentUpdate:
      type: object
      properties:
        name:
          type: string
          maxLength: 255

    # ── Field definitions ──────────────────
    FieldType:
      type: string
      enum: [text, textarea, single_dropdown, multi_select, file_upload]
      description: |
        - text: single-line text input
        - textarea: multi-line text input
        - single_dropdown: select exactly one option
        - multi_select: select one or more options
        - file_upload: named document slot; citizen uploads a file and the returned
          stagedFileId is submitted as the field value

    FieldDefinition:
      type: object
      required: [name, type]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          example: "Planta Baixa"
        type:
          $ref: '#/components/schemas/FieldType'
        required:
          type: boolean
          default: false
        order:
          type: integer
        options:
          type: array
          description: Required when type is single_dropdown or multi_select; not used for file_upload
          items:
            $ref: '#/components/schemas/FieldOption'

    FieldValue:
      type: object
      required: [fieldId, value]
      properties:
        fieldId:
          type: string
          format: uuid
        value:
          description: |
            String for text/textarea; string for single_dropdown (option value);
            array of strings for multi_select;
            stagedFileId string for file_upload (obtained from POST /uploads/stage before submission).
          oneOf:
            - type: string
            - type: array
              items:
                type: string

    FieldDefinitionInput:
      type: object
      required: [name, type]
      properties:
        name:
          type: string
        type:
          $ref: '#/components/schemas/FieldType'
        required:
          type: boolean
          default: false
        order:
          type: integer
        options:
          type: array
          items:
            $ref: '#/components/schemas/FieldOption'

    # ── SLA ────────────────────────────────
    SLA:
      type: object
      properties:
        id:
          type: string
          format: uuid
        durationHours:
          type: integer
          example: 48

    SLAInput:
      type: object
      required: [durationHours]
      properties:
        durationHours:
          type: integer
          minimum: 1
          example: 48

    # ── Request Type ───────────────────────
    RequestTypeStatus:
      type: string
      enum: [draft, active, archived]

    RequestTypeSummary:
      type: object
      required: [id, name, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        status:
          $ref: '#/components/schemas/RequestTypeStatus'
        department:
          $ref: '#/components/schemas/Department'
        sla:
          $ref: '#/components/schemas/SLA'
        createdAt:
          type: string
          format: date-time

    RequestType:
      allOf:
        - $ref: '#/components/schemas/RequestTypeSummary'
        - type: object
          properties:
            fields:
              type: array
              items:
                $ref: '#/components/schemas/FieldDefinition'
            createdBy:
              $ref: '#/components/schemas/UserSummary'
            workflow:
              $ref: '#/components/schemas/Workflow'

    RequestTypeInput:
      type: object
      required: [name, departmentId]
      properties:
        name:
          type: string
          maxLength: 255
        status:
          $ref: '#/components/schemas/RequestTypeStatus'
        departmentId:
          type: string
          format: uuid
        sla:
          $ref: '#/components/schemas/SLAInput'
        fields:
          type: array
          items:
            $ref: '#/components/schemas/FieldDefinitionInput'

    RequestTypeUpdate:
      type: object
      properties:
        name:
          type: string
          maxLength: 255
        status:
          $ref: '#/components/schemas/RequestTypeStatus'
        departmentId:
          type: string
          format: uuid
        sla:
          $ref: '#/components/schemas/SLAInput'
        fields:
          type: array
          items:
            $ref: '#/components/schemas/FieldDefinitionInput'

    # ── Workflow ───────────────────────────
    Workflow:
      type: object
      properties:
        id:
          type: string
          format: uuid
        requestTypeId:
          type: string
          format: uuid
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/TaskDefinition'
        updatedAt:
          type: string
          format: date-time

    WorkflowInput:
      type: object
      required: [tasks]
      properties:
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/TaskDefinitionInput'

    TaskDefinition:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        key:
          type: string
          example: "legal-review"
        name:
          type: string
          example: "Legal review"
        departmentId:
          type: string
          format: uuid
          nullable: true
        assigneeRole:
          type: string
          nullable: true
        assigneeUserId:
          type: string
          format: uuid
          nullable: true
        deadlineOffsetHours:
          type: integer
          nullable: true
          example: 24
        dependsOn:
          type: array
          items:
            type: string
          example: ["initial-review"]

    TaskDefinitionInput:
      type: object
      required: [key, name]
      properties:
        key:
          type: string
        name:
          type: string
        departmentId:
          type: string
          format: uuid
          nullable: true
        assigneeRole:
          type: string
          nullable: true
        assigneeUserId:
          type: string
          format: uuid
          nullable: true
        deadlineOffsetHours:
          type: integer
          nullable: true
        dependsOn:
          type: array
          items:
            type: string
          default: []

    # ── Request ────────────────────────────
    RequestStatus:
      type: string
      enum: [open, in_progress, pending_clarification, completed, rejected, cancelled]
      description: |
        - open: submitted, not yet acted on
        - in_progress: one or more tasks are active
        - pending_clarification: workflow paused; awaiting citizen response
        - completed: all workflow tasks approved and finished
        - rejected: rejected by a task assignee
        - cancelled: cancelled by the citizen or internal user

    Request:
      type: object
      required: [id, protocolNumber, requestType, status, name, fieldValues, attachments, requester, activeTasks, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        protocolNumber:
          type: string
          example: "LIC-2026-000123"
        requestType:
          $ref: '#/components/schemas/RequestTypeSummary'
        status:
          $ref: '#/components/schemas/RequestStatus'
        name:
          type: string
        notes:
          type: string
          nullable: true
        fieldValues:
          type: array
          items:
            $ref: '#/components/schemas/FieldValue'
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/Attachment'
        requester:
          $ref: '#/components/schemas/Citizen'
        activeTasks:
          type: array
          items:
            $ref: '#/components/schemas/TaskInstance'
        slaDeadline:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    RequestPage:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Request'
        pagination:
          $ref: '#/components/schemas/Pagination'

    RequestInput:
      type: object
      required: [requestTypeId, name]
      properties:
        requestTypeId:
          type: string
          format: uuid
        name:
          type: string
        notes:
          type: string
          nullable: true
        fieldValues:
          type: array
          items:
            $ref: '#/components/schemas/FieldValue'

    RequestCitizenUpdate:
      type: object
      properties:
        name:
          type: string
        notes:
          type: string
        fieldValues:
          type: array
          items:
            $ref: '#/components/schemas/FieldValue'

    RequestAdminUpdate:
      type: object
      properties:
        assignedToUserId:
          type: string
          format: uuid
          nullable: true

    # ── Attachment ─────────────────────────
    Attachment:
      type: object
      required: [id, name, mimeType, sizeBytes, url, uploadedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        mimeType:
          type: string
          example: application/pdf
        sizeBytes:
          type: integer
        url:
          type: string
          format: uri
          description: Signed URL for download (time-limited)
        uploadedBy:
          $ref: '#/components/schemas/UserSummary'
        uploadedAt:
          type: string
          format: date-time

    # ── File Staging ───────────────────────
    StagedFile:
      type: object
      properties:
        stagedFileId:
          type: string
          format: uuid
          description: Include as fieldValue for file_upload fields at request submission time
        name:
          type: string
        mimeType:
          type: string
        sizeBytes:
          type: integer
        expiresAt:
          type: string
          format: date-time

    # ── Task Instance ──────────────────────
    TaskInstanceStatus:
      type: string
      enum: [waiting, active, completed, skipped]
      description: |
        - waiting: dependencies not yet met
        - active: ready for action
        - completed: finished (see outcome)
        - skipped: bypassed due to upstream rejection or cancellation

    TaskOutcome:
      type: string
      enum: [approved, rejected, clarification_requested]
      description: |
        - approved: workflow continues
        - rejected: request moves to `rejected`; no further tasks activate
        - clarification_requested: request moves to `pending_clarification`;
          a follow-up of type `clarification_request` is created automatically

    TaskInstance:
      type: object
      required: [id, requestId, taskDefinition, status]
      properties:
        id:
          type: string
          format: uuid
        requestId:
          type: string
          format: uuid
        taskDefinition:
          $ref: '#/components/schemas/TaskDefinition'
        status:
          $ref: '#/components/schemas/TaskInstanceStatus'
        outcome:
          allOf:
            - $ref: '#/components/schemas/TaskOutcome'
          nullable: true
        assignedTo:
          allOf:
            - $ref: '#/components/schemas/UserSummary'
          nullable: true
        activatedAt:
          type: string
          format: date-time
          nullable: true
        deadline:
          type: string
          format: date-time
          nullable: true
        completedAt:
          type: string
          format: date-time
          nullable: true
        completionNotes:
          type: string
          nullable: true

    TaskInstanceUpdate:
      type: object
      properties:
        assignedToUserId:
          type: string
          format: uuid
          nullable: true

    # ── Follow-up ──────────────────────────
    FollowUpType:
      type: string
      enum: [message, clarification_request, clarification_response]
      description: |
        - message: general communication
        - clarification_request: created automatically when a task outcome is `clarification_requested`
        - clarification_response: citizen reply; resumes workflow and moves request back to `in_progress`

    FollowUp:
      type: object
      required: [id, requestId, type, author, message, createdAt]
      properties:
        id:
          type: string
          format: uuid
        requestId:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/FollowUpType'
        author:
          $ref: '#/components/schemas/UserSummary'
        message:
          type: string
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/Attachment'
        createdAt:
          type: string
          format: date-time

    FollowUpInput:
      type: object
      required: [message, type]
      properties:
        type:
          $ref: '#/components/schemas/FollowUpType'
        message:
          type: string

    # ── Notification Settings ───────────────
    NotificationEvent:
      type: string
      enum:
        - consumer_registered
        - request_submitted
        - task_assigned
        - task_handover
        - clarification_requested
        - clarification_responded
        - request_completed
        - request_rejected
        - request_cancelled
      description: |
        - consumer_registered: new citizen account created
        - request_submitted: citizen submits a new request
        - task_assigned: a task is activated and assigned
        - task_handover: a task is completed and the next task(s) activate
        - clarification_requested: assignee requests more information from the citizen
        - clarification_responded: citizen replies to a clarification request
        - request_completed: all tasks approved; request finished
        - request_rejected: request rejected by an assignee
        - request_cancelled: request cancelled

    NotificationRule:
      type: object
      properties:
        event:
          $ref: '#/components/schemas/NotificationEvent'
        notifyAssignee:
          type: boolean
          default: true
        notifyRequester:
          type: boolean
          default: true

    NotificationSettings:
      type: object
      properties:
        id:
          type: string
          format: uuid
        requestTypeId:
          type: string
          format: uuid
        rules:
          type: array
          description: |
            One rule per event. Events not listed use the default (both assignee
            and requester notified). Replacing the full settings replaces all rules.
          items:
            $ref: '#/components/schemas/NotificationRule'
        updatedAt:
          type: string
          format: date-time

    NotificationSettingsInput:
      type: object
      required: [rules]
      properties:
        rules:
          type: array
          items:
            type: object
            required: [event]
            properties:
              event:
                $ref: '#/components/schemas/NotificationEvent'
              notifyAssignee:
                type: boolean
                default: true
              notifyRequester:
                type: boolean
                default: true
