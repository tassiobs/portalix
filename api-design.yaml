openapi: 3.0.3
info:
  title: Client Portal Platform API
  version: 2.3.0
  description: |
    API for the Client Portal Platform. Covers three access contexts:
    - **Organization management**: org members manage portals and internal users
    - **Portal administration**: internal users manage request types, workflows, and process requests
    - **Client portal**: citizens self-register on a specific portal and submit requests

    **Authentication**: All endpoints not marked `security: []` require a Bearer JWT.
    Any authenticated endpoint can return `401` if the token is missing or invalid,
    even when not explicitly listed in that operation's responses.

    **Pagination**: Collections that may grow unboundedly (users, requests) return a
    paginated envelope `{ data: [], pagination: {} }`. Small, naturally bounded
    collections (roles, departments, permissions, request types, workflow tasks) return
    bare arrays. This is intentional and consistent.

    **Spec vs URL version**: `info.version` (2.3.0) tracks the document revision.
    The URL prefix `/api/v1` is the API routing version — these two numbers are
    independent and can diverge as the spec evolves.

servers:
  - url: https://portalu-production.up.railway.app/api/v1

security:
  - bearerAuth: []

tags:
  - name: Auth
    description: Organization member authentication and profile
  - name: Organizations
    description: Organization profile
  - name: Portals
    description: Portal lifecycle — create, configure, soft-delete
  - name: Org Users
    description: Internal user management at organization level
  - name: Org Roles
    description: RBAC role management at organization level
  - name: Portal Users
    description: Internal user management within a portal
  - name: Portal Roles
    description: RBAC role management within a portal
  - name: Org Settings
    description: Organization-level configuration including citizen identity scope
  - name: Portal Settings
    description: Portal-level configuration
  - name: Departments
    description: Department management within a portal
  - name: Request Types
    description: Request type configuration within a portal
  - name: Workflows
    description: Workflow definitions attached to request types
  - name: Notification Settings
    description: Email notification configuration per request type
  - name: Requests
    description: Request lifecycle — internal user view
  - name: Request Tasks
    description: Task management within a request
  - name: Org Sessions
    description: Active session management for org members
  - name: Org Invitations
    description: Pending invitation management for org users
  - name: Client Auth
    description: Citizen authentication and profile on a specific portal
  - name: Client Sessions
    description: Active session management for citizens
  - name: Client Requests
    description: Request lifecycle — citizen view
  - name: File Uploads
    description: File staging for form submissions with file_upload fields

# ─────────────────────────────────────────────
# PATHS
# ─────────────────────────────────────────────
paths:

  # ── Auth (Org Members) ────────────────────
  /auth/sign-up:
    post:
      tags: [Auth]
      operationId: signUp
      summary: Sign up and create a new organization
      description: |
        Creates a new organization and registers the caller as its Org Super Admin.
        A verification email is sent to the provided address.
        The account cannot be used to sign in until the email is verified.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, org_name]
              properties:
                org_name:
                  type: string
                  description: Name of the organization to create
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
                  minLength: 8
                name:
                  type: string
                  description: Full name (optional at sign-up)
      responses:
        '201':
          description: Account created; verification email sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignUpResponse'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /auth/verify-email:
    post:
      tags: [Auth]
      operationId: verifyEmail
      summary: Verify email address
      description: |
        Exchanges the token from the verification email for a confirmed account.
        After successful verification the user is authenticated and receives a JWT.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
      responses:
        '200':
          description: Email verified; account active
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Token invalid or expired

  /auth/resend-verification:
    post:
      tags: [Auth]
      operationId: resendVerification
      summary: Resend verification email
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        '204':
          description: Verification email resent (same response whether the email exists or not)

  /auth/sign-in:
    post:
      tags: [Auth]
      operationId: signIn
      summary: Sign in as an org member
      description: |
        Password-based sign-in for internal org members.
        Returns 403 if the account exists but email is not yet verified.
        Returns 423 if the account is locked due to too many failed attempts (only when lockout is enabled in OrgSettings).
        Returns 202 with an MFA challenge token if MFA is enabled and required for this org.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Email not yet verified
        '202':
          description: |
            MFA required. Credentials are valid but a second factor must be provided.
            Submit the returned `mfaToken` plus the TOTP code to POST /auth/mfa/challenge.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaChallengeResponse'
        '423':
          description: Account locked due to too many failed sign-in attempts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/sign-out:
    post:
      tags: [Auth]
      operationId: signOut
      summary: Sign out (invalidate token)
      responses:
        '204':
          description: Signed out

  /auth/me:
    get:
      tags: [Auth]
      operationId: getMe
      summary: Get current org member profile
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgUser'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      tags: [Auth]
      operationId: updateMe
      summary: Update own profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdate'
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgUser'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /auth/forgot-password:
    post:
      tags: [Auth]
      operationId: forgotPassword
      summary: Request a password reset email
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        '204':
          description: Reset email sent (same response whether the email exists or not)

  /auth/reset-password:
    post:
      tags: [Auth]
      operationId: resetPassword
      summary: Reset password using email token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, newPassword]
              properties:
                token:
                  type: string
                  description: Token from the password reset email
                newPassword:
                  type: string
                  format: password
                  minLength: 8
      responses:
        '204':
          description: Password updated; all existing sessions invalidated
        '401':
          description: Token invalid or expired
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /auth/accept-invite:
    post:
      tags: [Auth]
      operationId: acceptInvite
      summary: Accept an org user invitation and set password
      description: |
        Exchanges the invitation token (sent via email when an org user is created)
        for an active account. The invitee sets their password and receives a JWT.
        Returns 409 if the invitation has already been accepted.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token:
                  type: string
                  description: Invitation token from the email
                password:
                  type: string
                  format: password
                  minLength: 8
                name:
                  type: string
                  description: Override the name set by the admin at invite time
      responses:
        '200':
          description: Invitation accepted; account active
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Token invalid or expired
        '409':
          $ref: '#/components/responses/Conflict'

  /auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshToken
      summary: Refresh an org member access token
      description: |
        Exchanges a valid refresh token for a new access token and a rotated
        refresh token. The old refresh token is immediately invalidated.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
      responses:
        '200':
          description: New token pair issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Refresh token invalid or expired

  /auth/sessions:
    get:
      tags: [Org Sessions]
      operationId: listSessions
      summary: List active sessions for the current org member
      responses:
        '200':
          description: Active sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Session'
    delete:
      tags: [Org Sessions]
      operationId: revokeAllSessions
      summary: Sign out of all devices (revoke all sessions)
      description: Invalidates all active sessions except the current one.
      responses:
        '204':
          description: All other sessions revoked

  /auth/sessions/{sessionId}:
    parameters:
      - $ref: '#/components/parameters/sessionId'
    delete:
      tags: [Org Sessions]
      operationId: revokeSession
      summary: Revoke a specific session
      responses:
        '204':
          description: Session revoked
        '404':
          $ref: '#/components/responses/NotFound'

  /auth/mfa/enroll:
    post:
      tags: [Auth]
      operationId: enrollMfa
      summary: Start MFA enrollment (TOTP)
      description: |
        Initiates TOTP enrollment for the current org member. Returns a secret and
        a QR code URL to be scanned with an authenticator app. Enrollment is not
        active until confirmed via POST /auth/mfa/confirm-enrollment.
        Returns 409 if MFA is already enrolled.
      responses:
        '200':
          description: TOTP enrollment initiated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaEnrollment'
        '409':
          $ref: '#/components/responses/Conflict'

  /auth/mfa/confirm-enrollment:
    post:
      tags: [Auth]
      operationId: confirmMfaEnrollment
      summary: Confirm MFA enrollment with a TOTP code
      description: |
        Verifies the first TOTP code from the authenticator app and activates MFA
        for the account. Returns 401 if the code is invalid.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  description: 6-digit TOTP code from the authenticator app
      responses:
        '204':
          description: MFA enrolled and active
        '401':
          description: TOTP code invalid

  /auth/mfa/challenge:
    post:
      tags: [Auth]
      operationId: mfaChallenge
      summary: Complete sign-in with MFA code
      description: |
        Exchanges an `mfaToken` (from a 202 sign-in response) plus a TOTP code for
        a full auth token pair. The `mfaToken` is single-use and short-lived (5 minutes).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mfaToken, code]
              properties:
                mfaToken:
                  type: string
                  description: The token returned in the 202 sign-in response
                code:
                  type: string
                  description: 6-digit TOTP code from the authenticator app
      responses:
        '200':
          description: MFA verified; full session issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: mfaToken or TOTP code invalid or expired

  /auth/mfa:
    delete:
      tags: [Auth]
      operationId: disableMfa
      summary: Disable MFA for the current org member
      description: |
        Removes TOTP enrollment. Requires the current TOTP code to confirm intent.
        Returns 403 if MFA is enforced org-wide (mfa.required = true in OrgSettings).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  description: Current TOTP code to confirm identity
      responses:
        '204':
          description: MFA disabled
        '401':
          description: TOTP code invalid
        '403':
          description: MFA is enforced org-wide and cannot be disabled

  /auth/me/verify-email-change:
    post:
      tags: [Auth]
      operationId: verifyEmailChange
      summary: Verify a pending email change
      description: |
        When an org member changes their email via PATCH /auth/me, a verification
        email is sent to the new address. The old email remains active until this
        endpoint is called with the token from that email.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
      responses:
        '204':
          description: Email change confirmed; new email is now active
        '401':
          description: Token invalid or expired

  /auth/me/delete:
    post:
      tags: [Auth]
      operationId: requestAccountDeletion
      summary: Request deletion of own org member account (LGPD)
      description: |
        Initiates an account deletion request in compliance with LGPD (Brazil's data
        protection law). The account is scheduled for deletion after a grace period
        (default 30 days) during which the user may cancel. All active sessions are
        invalidated immediately. Historical request data is anonymised, not deleted.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  description: Optional reason for account deletion
      responses:
        '204':
          description: Deletion request accepted; account scheduled for removal

  # ── Org Invitations ───────────────────────
  /org/invitations:
    get:
      tags: [Org Invitations]
      operationId: listInvitations
      x-required-permissions: [org.users.manage]
      summary: List pending org user invitations
      description: Requires org.users.manage permission.
      responses:
        '200':
          description: Pending invitations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Invitation'
        '403':
          $ref: '#/components/responses/Forbidden'

  /org/invitations/{invitationId}/resend:
    parameters:
      - $ref: '#/components/parameters/invitationId'
    post:
      tags: [Org Invitations]
      operationId: resendInvitation
      x-required-permissions: [org.users.manage]
      summary: Resend an invitation email
      description: |
        Issues a new invitation token and sends a fresh email. The previous
        token is invalidated. Requires org.users.manage permission.
      responses:
        '204':
          description: Invitation resent
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Invitation already accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /org/invitations/{invitationId}:
    parameters:
      - $ref: '#/components/parameters/invitationId'
    delete:
      tags: [Org Invitations]
      operationId: cancelInvitation
      x-required-permissions: [org.users.manage]
      summary: Cancel a pending invitation
      description: |
        Revokes the invitation token. The user account is also deactivated if
        they have not yet accepted. Requires org.users.manage permission.
      responses:
        '204':
          description: Invitation cancelled
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Invitation already accepted; deactivate the user instead
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ── Organization ──────────────────────────
  /org:
    get:
      tags: [Organizations]
      operationId: getOrg
      summary: Get current organization
      responses:
        '200':
          description: Organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
    patch:
      tags: [Organizations]
      operationId: updateOrg
      x-required-permissions: [org.users.manage, org.portals.manage]
      summary: Update organization
      description: Requires org.users.manage or org.portals.manage permission.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationUpdate'
      responses:
        '200':
          description: Updated organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  # ── Org Settings ─────────────────────────
  /org/settings:
    get:
      tags: [Org Settings]
      operationId: getOrgSettings
      summary: Get organization settings
      description: Accessible to any authenticated org member.
      responses:
        '200':
          description: Organization settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgSettings'
    patch:
      tags: [Org Settings]
      operationId: updateOrgSettings
      x-required-permissions: [org.portals.manage]
      summary: Update organization settings
      description: |
        Requires org.portals.manage permission.
        Changing `citizenIdentityScope` is a breaking operation: switching from
        `portal` to `org` merges citizen identities by email across portals.
        Switching from `org` back to `portal` is not permitted once citizens
        have signed up across multiple portals.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrgSettingsUpdate'
      responses:
        '200':
          description: Updated organization settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgSettings'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  # ── Portals ───────────────────────────────
  /portals:
    get:
      tags: [Portals]
      operationId: listPortals
      x-required-permissions: [org.portals.manage]
      summary: List portals in the organization
      description: Requires org.portals.manage permission.
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [active, archived]
      responses:
        '200':
          description: List of portals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Portal'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Portals]
      operationId: createPortal
      x-required-permissions: [org.portals.manage]
      summary: Create a portal
      description: Requires org.portals.manage permission.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PortalInput'
      responses:
        '201':
          description: Portal created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Portal'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /portals/{portalId}:
    parameters:
      - $ref: '#/components/parameters/portalId'
    get:
      tags: [Portals]
      operationId: getPortal
      x-required-permissions: [org.portals.manage]
      summary: Get a portal
      description: Requires org.portals.manage permission.
      responses:
        '200':
          description: Portal detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Portal'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Portals]
      operationId: updatePortal
      x-required-permissions: [org.portals.manage]
      summary: Update a portal
      description: Requires org.portals.manage permission.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PortalUpdate'
      responses:
        '200':
          description: Updated portal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Portal'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    delete:
      tags: [Portals]
      operationId: archivePortal
      x-required-permissions: [org.portals.manage]
      summary: Archive a portal (soft delete)
      description: |
        Soft-deletes the portal. All data (requests, request types, users) is
        preserved but the portal becomes inaccessible.
        Requires org.portals.manage permission.
      responses:
        '204':
          description: Portal archived
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ── Org Users ─────────────────────────────
  /org/users:
    get:
      tags: [Org Users]
      operationId: listOrgUsers
      x-required-permissions: [org.users.manage]
      summary: List org users
      description: Requires org.users.manage permission.
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [active, inactive]
        - name: search
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: perPage
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Paginated list of org users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgUserPage'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Org Users]
      operationId: createOrgUser
      x-required-permissions: [org.users.manage]
      summary: Add an internal org user
      description: |
        Creates an internal user account and sends an invitation email.
        Org users can only be added internally — no self-registration at org level.
        Requires org.users.manage permission.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrgUserInput'
      responses:
        '201':
          description: User created and invitation sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgUser'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /org/users/{userId}:
    parameters:
      - $ref: '#/components/parameters/userId'
    get:
      tags: [Org Users]
      operationId: getOrgUser
      x-required-permissions: [org.users.manage]
      summary: Get an org user
      description: Requires org.users.manage permission.
      responses:
        '200':
          description: Org user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgUser'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Org Users]
      operationId: updateOrgUser
      x-required-permissions: [org.users.manage]
      summary: Update an org user
      description: Requires org.users.manage permission.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrgUserUpdate'
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgUser'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
