name: Sync openapi.json to portalix-docs

on:
  push:
    branches:
      - main

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout portalu
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PORTALIX_DOCS_PAT }}

      - name: Fetch live OpenAPI spec from Railway
        run: |
          curl -sf https://portalu-production.up.railway.app/openapi.json -o openapi.json
          echo "Fetched openapi.json:"
          cat openapi.json | python3 -c "import json,sys; d=json.load(sys.stdin); print(f'  version: {d[\"info\"][\"version\"]}, paths: {len(d[\"paths\"])}')"

      - name: Commit updated openapi.json to portalu
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add openapi.json
          if git diff --cached --quiet; then
            echo "openapi.json unchanged, skipping"
          else
            git commit -m "chore: update openapi.json from live API"
            git push
          fi

      - name: Checkout portalix-docs
        uses: actions/checkout@v4
        with:
          repository: tassiobs/portalix-docs
          token: ${{ secrets.PORTALIX_DOCS_PAT }}
          path: portalix-docs

      - name: Copy openapi.json to portalix-docs
        run: |
          cp openapi.json portalix-docs/openapi.json
          cp openapi.json portalix-docs/public/openapi.json

      - name: Commit and push to portalix-docs
        working-directory: portalix-docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add openapi.json public/openapi.json
          if git diff --cached --quiet; then
            echo "No changes to sync"
          else
            git commit -m "chore: sync openapi.json from live API"
            git push
          fi
