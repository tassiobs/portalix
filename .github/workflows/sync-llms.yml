name: Sync llms.txt

on:
  push:
    branches: [main]
    paths:
      - api-design.yaml

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Regenerate API Reference section in llms.txt
        run: python scripts/generate_llms_reference.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add llms.txt
          git diff --cached --quiet && echo "No changes." || \
            git commit -m "chore: auto-update llms.txt API reference from spec" && \
            git push
